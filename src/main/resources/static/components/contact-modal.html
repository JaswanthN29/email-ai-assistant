<!-- Glassmorphic Contact Modal Overlay -->
<div id="contact-modal" class="modal-overlay" onclick="closeContactModalViaOverlay(event)">
    <div class="modal-card">
        <button class="modal-close-btn" onclick="closeContactModal()"><i class="fa-solid fa-xmark"></i></button>
        <div class="card-header" style="border-bottom: none; margin-bottom: 1rem; padding-bottom: 0;">
            <i class="fa-solid fa-paper-plane" style="color: var(--text-main);"></i>
            <h2>Contact Us</h2>
        </div>
        
        <form id="telegram-form">
            <div class="form-group">
                <label for="contact-name">Your Name</label>
                <div class="input-wrapper">
                    <input type="text" id="contact-name" class="form-control" placeholder="Enter your name..." required style="padding-left: 3.25rem;">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="message-text">Your Message</label>
                <div class="input-wrapper">
                    <textarea id="message-text" class="form-control" placeholder="Type your message to Jaswanth here..." required></textarea>
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>
            </div>

            <!-- Add Browser Details Toggle -->
            <div class="toggle-group">
                <span class="toggle-label">
                    <i class="fa-solid fa-laptop-code"></i>
                    Include device & browser details
                </span>
                <label class="toggle-switch">
                    <input type="checkbox" id="attach-details-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <button type="submit" class="btn" id="send-btn">
                <span id="btn-content">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </span>
            </button>
        </form>

        <div id="telegram-response" class="response-panel"></div>
    </div>
</div>
