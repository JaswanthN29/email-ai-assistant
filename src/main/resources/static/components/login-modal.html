<!-- Glassmorphic Login Modal Overlay -->
<div id="login-modal" class="modal-overlay" onclick="closeLoginModalViaOverlay(event)">
    <div class="modal-card" style="max-width: 420px;">
        <button class="modal-close-btn" onclick="closeLoginModal()"><i class="fa-solid fa-xmark"></i></button>
        <div class="card-header" style="border-bottom: none; margin-bottom: 1.5rem; padding-bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-lock" style="color: var(--text-main); font-size: 2.2rem;"></i>
            <h2 style="font-size: 1.6rem; text-align: center;">Sign In</h2>
            <p style="color: var(--text-sub); font-size: 0.88rem; font-weight: 500; text-align: center; margin-top: -0.25rem;">Access secure panel</p>
        </div>
        
        <form id="login-form" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="login-username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="login-username" class="form-control" placeholder="Enter username..." required style="padding-left: 3.25rem;">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="login-password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" class="form-control" placeholder="Enter password..." required style="padding-left: 3.25rem;">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>

            <button type="submit" class="btn" id="login-submit-btn">
                <span id="login-btn-content">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </span>
            </button>
        </form>

        <div id="login-response" class="response-panel"></div>
    </div>
</div>
