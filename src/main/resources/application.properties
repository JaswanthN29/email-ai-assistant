spring.application.name=email-ai-assistant

# CSS tokens from user (kept as comments to avoid breaking properties format)
# p.p1 {margin: 0.0px 0.0px 0.0px 0.0px; font: 13.0px 'Helvetica Neue'; color: #000000}
# p.p2 {margin: 0.0px 0.0px 0.0px 0.0px; font: 13.0px '.AppleSystemUIFontMonospaced'; color: #000000}

# Telegram bot token — do NOT store secrets in source control.
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# Enable detailed logging to a file with request details and DEBUG-level information.
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.example=INFO
logging.file.name=logs/email-ai-assistant.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Disable DevTools restart so stale classloader artifacts do not interfere with startup.
spring.devtools.restart.enabled=false

# Gmail OAuth callback port; use a free port if 8888 is already occupied.
google.oauth.port=8888

# Log request details and access log output.
spring.mvc.log-request-details=true
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i"
server.tomcat.accesslog.file-date-format=
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Default Telegram Chat ID for assistant messaging
telegram.chat.id=978757852

# RAG & Pinecone Vector Store Configuration
pega.rag.vector-store-path=rag-store.json
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Resolved references through environment variables
google.api.key=${GOOGLE_API_KEY}
pinecone.api.key=${PINECONE_API_KEY}
pinecone.index=${PINECONE_INDEX}

# Map externalized environment properties to Spring AI properties
spring.ai.vectorstore.pinecone.api-key=${pinecone.api.key}
spring.ai.vectorstore.pinecone.index-name=${pinecone.index}
spring.ai.vectorstore.pinecone.namespace=default
spring.ai.vectorstore.pinecone.project-id=r7246jv
spring.ai.vectorstore.pinecone.environment=aped-4627-b74a

# Google GenAI / Gemini configuration
spring.ai.google.genai.api-key=${google.api.key}
spring.ai.google.genai.project-id=500468390206
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.embedding.api-key=${google.api.key}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=384



