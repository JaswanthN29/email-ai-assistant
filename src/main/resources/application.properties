# Enable detailed logging to a file with request details and DEBUG-level information.
logging.level.root=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example=DEBUG
logging.file.name=logs/email-ai-assistant.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Disable DevTools restart so stale classloader artifacts do not interfere with startup.
spring.devtools.restart.enabled=false

# Gmail OAuth callback port; use a free port if 8888 is already occupied.
google.oauth.port=8888

# Log request details and access log output.
spring.mvc.log-request-details=true
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i"
server.tomcat.accesslog.file-date-format=
server.port=8081

